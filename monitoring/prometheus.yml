
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "python-task-manager"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "app:5000"

  - job_name: "python-devops-kubernetes"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:8081"
