
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>DevOps Task Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f4f6f9;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 65%;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

        li {
            margin: 15px 0;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Python DevOps Task Manager</h1>

    <p>Manage your tasks using our Flask application.</p>

    <form action="/add" method="POST">

        <input
            type="text"
            name="title"
            placeholder="Enter a new task"
            maxlength="150"
            required
        >

        <button type="submit">Add Task</button>

    </form>

    <h2>My Tasks</h2>

    <ul>

        {% for task in tasks %}

        <li>

            <span class="{{ 'completed' if task.completed else '' }}">
                {{ task.title }}
            </span>

            <form
                action="/complete/{{ task.id }}"
                method="POST"
                style="display:inline"
            >
                <button type="submit">
                    Complete / Undo
                </button>
            </form>

            <form
                action="/delete/{{ task.id }}"
                method="POST"
                style="display:inline"
            >
                <button type="submit">
                    Delete
                </button>
            </form>

        </li>

        {% else %}

        <li>No tasks available.</li>

        {% endfor %}

    </ul>

    <p>
        Application status:
        <a href="/health">Health Check</a>
    </p>

</div>

</body>
</html>
