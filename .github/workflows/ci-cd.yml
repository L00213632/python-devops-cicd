
name: Python DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  # Stage 1: Build and Unit Testing
  build-test:
    name: Build and Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python application
        run: |
          python -m compileall -q app

      - name: Run unit tests
        run: |
          python -m pytest -v

  # Stage 2: Security Scanning
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install bandit pip-audit

      - name: Run Bandit security scan
        run: |
          bandit -r app -f txt

      - name: Run dependency vulnerability scan
        run: |
          pip-audit -r requirements-dev.txt

  # Stage 3: Docker Build and Security Scan
  container:
    name: Docker Build and Security Scan
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t python-devops-task-manager:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: python-devops-task-manager:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      
      - name: Publish Docker image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker tag python-devops-task-manager:${{ github.sha }} "$IMAGE_NAME"
          docker push "$IMAGE_NAME"


  # Stage 4: Deploy to AWS
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: container

    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_AWS == 'true' }}

    steps:
      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository }}:latest

            docker stop python-devops-task-manager || true
            docker rm python-devops-task-manager || true

            docker run -d \
              --name python-devops-task-manager \
              -p 8000:8000 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              ghcr.io/${{ github.repository }}:latest

  # Stage 5: Final Pipeline Notification
  notification:
    name: Final Pipeline Notification
    runs-on: ubuntu-latest
    needs:
      - build-test
      - security
      - container
      - deploy

    if: always()

    steps:
      - name: Display pipeline results
        run: |
          echo "=================================="
          echo "Python DevOps CI/CD Pipeline"
          echo "=================================="
          echo "Build and Test: ${{ needs.build-test.result }}"
          echo "Security Scan: ${{ needs.security.result }}"
          echo "Docker Build and Scan: ${{ needs.container.result }}"
          echo "AWS Deployment: ${{ needs.deploy.result }}"
          echo "=================================="

      - name: Send final email notification
        if: ${{ env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.NOTIFICATION_EMAIL != '' }}
        uses: dawidd6/action-send-mail@v4
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: Python DevOps CI/CD Pipeline Results
          to: ${{ env.NOTIFICATION_EMAIL }}
          from: ${{ env.SMTP_USERNAME }}
          body: |
            Python DevOps CI/CD pipeline has completed.

            Build and Test: ${{ needs.build-test.result }}
            Security Scan: ${{ needs.security.result }}
            Docker Build and Scan: ${{ needs.container.result }}
            AWS Deployment: ${{ needs.deploy.result }}
