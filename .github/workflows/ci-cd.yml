
name: Python DevOps CI-CD Pipeline

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  build-test:
    name: Build and Unit Testing
    runs-on: ubuntu-latest

    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build application
        run: |
          python -m compileall -q app run.py
          echo "Python build completed"

      - name: Notify build outcome
        if: always() && env.SMTP_SERVER != '' && env.SMTP_PORT != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.NOTIFICATION_EMAIL != ''
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "Python CI-CD: Build outcome"
          to: ${{ env.NOTIFICATION_EMAIL }}
          from: ${{ env.SMTP_USERNAME }}
          body: |
            Build status: ${{ job.status }}
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}

      - name: Run unit tests
        run: |
          python -m pytest -v --cov=app --cov-report=term

      - name: Notify test outcome
        if: always() && env.SMTP_SERVER != '' && env.SMTP_PORT != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.NOTIFICATION_EMAIL != ''
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "Python CI-CD: Unit test outcome"
          to: ${{ env.NOTIFICATION_EMAIL }}
          from: ${{ env.SMTP_USERNAME }}
          body: |
            Test job status: ${{ job.status }}
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}

  security:
    name: Static Analysis and Security
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Bandit security scan
        run: |
          bandit -r app -ll

      - name: Dependency vulnerability scan
        run: |
          pip-audit -r requirements.txt

  container:
    name: Docker Build and Security Scan
    needs: security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t python-devops-task-manager:${{ github.sha }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: python-devops-task-manager:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker tag python-devops-task-manager:${{ github.sha }} ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:latest

  deploy:
    name: Deploy to AWS EC2
    needs: container
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: DATABASE_URL,SECRET_KEY
          script: |
            docker pull ghcr.io/${{ github.repository }}:latest

            docker stop task-manager || true
            docker rm task-manager || true

            curl -fsSL \
              https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
              -o /home/${{ secrets.EC2_USERNAME }}/global-bundle.pem

            docker run -d \
              --name task-manager \
              --restart unless-stopped \
              -p 80:5000 \
              -e DATABASE_URL="$DATABASE_URL" \
              -e SECRET_KEY="$SECRET_KEY" \
              -v /home/${{ secrets.EC2_USERNAME }}/global-bundle.pem:/app/global-bundle.pem:ro \
              ghcr.io/${{ github.repository }}:latest

            docker ps

  notification:
    name: Final Pipeline Notification

    needs:
      - build-test
      - security
      - container
      - deploy

    if: always()
    runs-on: ubuntu-latest

    env:
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}

    steps:
      - name: Send final pipeline notification
        if: env.SMTP_SERVER != '' && env.SMTP_PORT != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.NOTIFICATION_EMAIL != ''
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "Python CI-CD: Final pipeline outcome"
          to: ${{ env.NOTIFICATION_EMAIL }}
          from: ${{ env.SMTP_USERNAME }}
          body: |
            Python CI-CD pipeline execution completed.

            Build: ${{ needs.build-test.result }}
            Security: ${{ needs.security.result }}
            Container: ${{ needs.container.result }}
            Deployment: ${{ needs.deploy.result }}

            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}
